# Coverage of the agent-team gate: only its three files and their tests carry the
# 100 % bar. The other scripts under scripts/ (the global hook guards) have no
# Python tests here. Listed under [report], because --cov=scripts makes coverage
# ignore an include under [run].
[run]
branch = True

[report]
include =
    */scripts/team-gate.py
    */scripts/teamgate_tasks.py
    */scripts/teamgate_cmd.py
    */scripts/tests/teamgate/*
